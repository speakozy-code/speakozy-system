name: Deploy Speakozy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Validate Firebase service account secret
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAKOZY_94075 }}
        run: |
          node -e 'const s=process.env.FIREBASE_SA||""; try { const j=JSON.parse(s); console.log("JSON valid:",true); console.log("Has client_email:",Boolean(j.client_email)); console.log("Service account:",j.type==="service_account"); } catch(e) { console.log("JSON valid:",false); console.log("Secret length:",s.length); }'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAKOZY_94075 }}"
          projectId: speakozy-94075
          target: main
          channelId: live
