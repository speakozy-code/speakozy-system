<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
var D={r:[],g:[],m:[],l:[],cur:"",attendance:[],teacherAbsences:[],finance:[]},tab="home",currentRole="owner",teacherName="",ed={},openGroups={},docRef=null,col=null,dl=null,ok=null,busy=false,again=false,ready=false,historyReady=false,undoing=false,skipMergeOnce=false,undoStack=[],flash="",fl={g:"",r:"",q:"",ls:"",lq:"",day:""};
var PAY=["لسه","دفع","جزئي"],REN=["لسه","هيجدد","مش هيجدد"],CK=["جروب الواتساب","جدول الغياب","فيدباك 1","فيدباك 2","فيدباك 3"];
var LEVEL_COUNT=["1","2","3","6"];
var LEAD_CATS=[["level","محتاج تحديد مستوى"],["contact","محتاج تواصل"],["waiting","مستني رد"],["later","متابعة لاحقًا"],["done","مكتمل / مش محتاج متابعة"]];
var LS=["جديد","كلمته","مستني رد","رن تاني","هيبدأ","اشترك","مش مهتم"];
var DAYS=["السبت والثلاثاء","الأحد والأربعاء","الاثنين والخميس"];
var LEVELS=["E1","E2","E3","Pre 1","Pre 2","Pre 3","Inter 1","Inter 2","Inter 3","Upper 1","Upper 2","Upper 3"];
var DM={sun:"أحد",mon:"اثنين",tue:"ثلاثاء",wed:"أربعاء",thu:"خميس",fri:"جمعة",sat:"سبت"};
function $(i){return document.getElementById(i)}
function el(t,c,x,p){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e}
function btn(p,x,c,f){var b=el("button",c,x,p);b.onclick=f;return b}
function inp(p,o,k,ph,type,ns){
  var i;
  if(k==="lv") { i=el("select","",null,p); opts(i,LEVELS,ph||"اختار الليفل",o[k]||""); }
  else { i=el("input","",null,p); i.placeholder=ph; i.value=o[k]||""; if(type)i.type=type; }
  if(type==="date"||type==="time")i.onclick=function(){try{i.showPicker()}catch(e){}};
  i.onchange=function(){o[k]=String(i.value||"").trim();if(!ns)save()};return i
}
function opts(s,arr,all,val){if(all!=null){var z=el("option","",all,s);z.value=""}arr.forEach(function(v){var a=Array.isArray(v),o=el("option","",a?v[1]:v,s);o.value=a?v[0]:v});s.value=val==null?"":val}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fixLvPaid(o){var n=Number(o.lvPaid);if(LEVEL_COUNT.indexOf(String(n))<0){if(!Number.isFinite(n)||n<1)n=1;else n=LEVEL_COUNT.map(Number).reduce(function(best,v){return Math.abs(v-n)<Math.abs(best-n)?v:best},1);o.lvPaid=n}return n}
function leadCategory(x){if(LEAD_CATS.some(function(c){return c[0]===x.followupCat}))return x.followupCat;if(x.st==="اشترك"||x.st==="مش مهتم")return"done";if(!String(x.lv||"").trim())return"level";if(x.st==="مستني رد")return"waiting";return"contact"}
function live(a){return a.filter(function(x){return !x.x})}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function norm(o){["r","g","m","l","attendance","teacherAbsences","finance"].forEach(function(k){o[k]=o[k]||[]});return o}
function merge(a,b){var n=0;["r","g","m","l"].forEach(function(k){var ids={};a[k].forEach(function(x){ids[x.id]=1});(b[k]||[]).forEach(function(x){if(!ids[x.id]){a[k].push(x);n++}})});if(!a.cur&&b.cur)a.cur=b.cur;if(!a.lb&&b.lb)a.lb=b.lb;return n}
function fm(x){if(!x)return"";var p=x.split(":"),h=+p[0],m=p[1],a=h>=12?"م":"ص";h=h%12||12;return h+(m&&m!=="00"?":"+m:"")+" "+a}
function tm(g){return g.t1||g.t2?[fm(g.t1),fm(g.t2)].filter(Boolean).join(" – "):(g.t||"")}
function gl(g){return g?(g.p?"🔒 ":"")+[g.lv,g.d,tm(g),g.tc].filter(Boolean).join(" · "):""}
function copyText(text,label){
  text=String(text||"").trim(); if(!text){flash="مفيش أرقام لنسخها";render();return}
  function done(){flash=label||"تم النسخ";render()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){fallback()})}else fallback();
  function fallback(){var t=el("textarea","",text,document.body);t.style.position="fixed";t.style.opacity="0";t.select();try{document.execCommand("copy");t.remove();done()}catch(e){t.remove();prompt("انسخ الأرقام:",text)}}
}
function phoneRaw(ph){return String(ph||"").trim()}
function links(p,ph){var raw=phoneRaw(ph);if(raw)el("span","tag phone",raw,p)}
function srch(p,v,f){var i=el("input","",null,p);i.placeholder="🔍 بحث";i.value=v;i.oninput=f;return i}

function setSt(){$("st").textContent=!ready?"⏳ بيحمّل":!docRef?"⚠️ على الجهاز بس":ok===false?"⚠️ فشل الحفظ":busy?"⏳ بيحفظ":"✅ محفوظ";var u=$("undoBtn");if(u){u.disabled=!undoStack.length||busy||!ready||!historyReady;u.title=undoStack.length?"التراجع عن آخر تغيير محفوظ":"مفيش إجراء متاح للتراجع"}}
function persistUndo(){try{localStorage.setItem("spk-hub-undo",JSON.stringify(undoStack.slice(-20)))}catch(e){}}
function undoLast(){
  if(!undoStack.length||busy)return;
  try{var previous=undoStack.pop();D=norm(JSON.parse(previous));persistUndo();undoing=true;skipMergeOnce=true;save();undoing=false;flash="تم التراجع عن آخر إجراء";render()}
  catch(e){undoing=false;skipMergeOnce=false;flash="تعذر استرجاع آخر إجراء";render()}
}
function save(){
  var forceOverwrite=skipMergeOnce;skipMergeOnce=false;
  try{var current=JSON.stringify(D),prior=localStorage.getItem("spk-hub");if(historyReady&&!undoing&&prior&&prior!==current){undoStack.push(prior);if(undoStack.length>20)undoStack.shift();persistUndo()}localStorage.setItem("spk-hub",current)}catch(e){}
  setSt();if(!docRef)return;
  if(busy){again=true;return}
  busy=true;
  docRef.get().then(function(s){
    var v=s&&(s.data?s.data():s);
    if(!forceOverwrite&&v&&v.d){try{merge(D,norm(JSON.parse(v.d)))}catch(e){}}
    return docRef.set({d:JSON.stringify(D),n:D.r.length+D.g.length+D.m.length+D.l.length});
  }).then(function(){ok=true}).catch(function(){ok=false}).then(function(){busy=false;setSt();if(again){again=false;save()}});
}
async function initDb(){
  try{
    var u=await claude.use("user"),d=await claude.use("db");dl=await claude.use("downloads");
    if(u&&d){
      var id=await u.id();col=d.collection("data/users/"+id);docRef=col.doc("all");
      var s=await docRef.get(),v=s&&(s.data?s.data():s);
      if(v&&v.d){
        var loc=D;D=norm(JSON.parse(v.d));merge(D,loc);
        var k=col.doc("bk-"+today()),sn=null;try{sn=await k.get()}catch(e){}
        var sv=sn&&(sn.data?sn.data():sn);
        if(!(sv&&sv.d))k.set({d:v.d,n:v.n}).catch(function(){});
      }
      ok=true;
    }
  }catch(e){docRef=null}
  ready=true;save();historyReady=true;render();
}

function mCard(p,m,full,glab,num){
  fixLvPaid(m);
  var c=el("div","card",null,p);
  if(full&&ed[m.id]){
    var r=el("div","row",null,c);inp(r,m,"n","الاسم");inp(r,m,"ph","التليفون");inp(r,m,"lv","المستوى");
    btn(r,m.nw?"جديد":"قديم","chip",function(){m.nw=m.nw?0:1;save();render()});
    r=el("div","row",null,c);inp(r,m,"nt","ملاحظة");
    btn(r,"تم","btn",function(){ed[m.id]=0;render()});return;
  }
  var line=el("div","student-line",null,c),identity=el("div","student-id",null,line);
  if(num)el("span","student-number",String(num),identity);
  el("div","nm",m.n||"بدون اسم",identity);
